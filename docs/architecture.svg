<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="680" fill="#fafbfc" rx="4"/>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">System Architecture</text>

  <!-- ═══ INGESTION LAYER ═══ -->
  <rect x="30" y="50" width="200" height="100" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="130" y="72" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">INGESTION</text>
  <text x="130" y="92" text-anchor="middle" font-size="12" fill="#1e293b">LSEG RNS Feed</text>
  <text x="130" y="108" text-anchor="middle" font-size="10" fill="#64748b">lseg_scraper.py</text>
  <text x="130" y="124" text-anchor="middle" font-size="10" fill="#64748b">3 index fetches (MCX, SMX, AXX)</text>
  <text x="130" y="140" text-anchor="middle" font-size="10" fill="#64748b">+ Excel upload fallback</text>

  <!-- Arrow: Ingestion → Classification -->
  <line x1="230" y1="100" x2="278" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ CLASSIFICATION ═══ -->
  <rect x="280" y="55" width="210" height="90" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="385" y="77" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="600">CLASSIFICATION</text>
  <text x="385" y="97" text-anchor="middle" font-size="12" fill="#1e293b">Article Classifier</text>
  <text x="385" y="113" text-anchor="middle" font-size="10" fill="#64748b">Claude Sonnet · classification.py</text>
  <text x="385" y="129" text-anchor="middle" font-size="10" fill="#64748b">→ pdmr | tr1 | regulatory | admin</text>

  <!-- ═══ THREE LENSES ═══ -->
  <!-- Lens group label -->
  <text x="460" y="178" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">THREE INDEPENDENT LENSES</text>

  <!-- Lens 1: Regulatory Catalyst -->
  <rect x="30" y="195" width="260" height="105" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="160" y="217" text-anchor="middle" font-size="11" fill="#a16207" font-weight="600">REGULATORY CATALYST LENS</text>
  <text x="160" y="237" text-anchor="middle" font-size="12" fill="#1e293b">Planning · Permits · Approvals</text>
  <text x="160" y="257" text-anchor="middle" font-size="10" fill="#64748b">Keyword pre-filter → Gemini Flash analysis</text>
  <text x="160" y="273" text-anchor="middle" font-size="10" fill="#64748b">lens_regulatory_catalyst.py</text>
  <text x="160" y="289" text-anchor="middle" font-size="10" fill="#94a3b8">One-shot · single LLM call</text>

  <!-- Lens 2: Director Purchasing -->
  <rect x="310" y="195" width="290" height="105" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="455" y="217" text-anchor="middle" font-size="11" fill="#15803d" font-weight="600">DIRECTOR PURCHASING LENS</text>
  <text x="455" y="237" text-anchor="middle" font-size="12" fill="#1e293b">Open-market PDMR Transactions</text>
  <text x="455" y="257" text-anchor="middle" font-size="10" fill="#64748b">Simple lens (Gemini) + 3-layer agentic (Claude)</text>
  <text x="455" y="273" text-anchor="middle" font-size="10" fill="#64748b">layer_runner.py · 13 tools · parallel execution</text>
  <text x="455" y="289" text-anchor="middle" font-size="10" fill="#94a3b8">L1: Platform · L2: Transaction · L3: Freshness</text>

  <!-- Lens 3: TR-1 Accumulation -->
  <rect x="620" y="195" width="270" height="105" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="755" y="217" text-anchor="middle" font-size="11" fill="#be123c" font-weight="600">TR-1 ACCUMULATION LENS</text>
  <text x="755" y="237" text-anchor="middle" font-size="12" fill="#1e293b">Significant Shareholder Crossings</text>
  <text x="755" y="257" text-anchor="middle" font-size="10" fill="#64748b">Notifier identity classification (Gemini)</text>
  <text x="755" y="273" text-anchor="middle" font-size="10" fill="#64748b">+ Google Search grounding for investor ID</text>
  <text x="755" y="289" text-anchor="middle" font-size="10" fill="#94a3b8">Opacity scoring · repeat-signal compounding</text>

  <!-- Arrows: Classification → Lenses -->
  <line x1="335" y1="145" x2="160" y2="193" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="385" y1="145" x2="455" y2="193" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="145" x2="755" y2="193" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══ PROPOSAL AGENT (cross-lens) ═══ -->
  <rect x="220" y="330" width="480" height="80" rx="6" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
  <text x="460" y="352" text-anchor="middle" font-size="11" fill="#a21caf" font-weight="600">PROPOSAL AGENT — CROSS-LENS AGGREGATION</text>
  <text x="460" y="372" text-anchor="middle" font-size="12" fill="#1e293b">Deterministic enrichment · No LLM calls</text>
  <text x="460" y="392" text-anchor="middle" font-size="10" fill="#64748b">Signal maturity (first / reinforced) · Cross-lens disqualification · Active lens count · TR-1 compounding</text>
  <text x="460" y="404" text-anchor="middle" font-size="10" fill="#94a3b8">proposal_agent.py</text>

  <!-- Arrows: Lenses → Proposal Agent -->
  <line x1="160" y1="300" x2="320" y2="328" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="455" y1="300" x2="460" y2="328" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="755" y1="300" x2="600" y2="328" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══ SIGNAL STATE ENGINE ═══ -->
  <rect x="30" y="440" width="260" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="462" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">SIGNAL STATE ENGINE</text>
  <text x="160" y="482" text-anchor="middle" font-size="12" fill="#1e293b">Deterministic state machine</text>
  <text x="160" y="498" text-anchor="middle" font-size="10" fill="#64748b">watching → monitor → active → reinforced</text>
  <text x="160" y="514" text-anchor="middle" font-size="10" fill="#64748b">Time-based decay · signal_state.py</text>
  <text x="160" y="524" text-anchor="middle" font-size="10" fill="#94a3b8">No LLM · pure transition rules</text>

  <!-- Arrow: Proposal Agent → State Engine -->
  <line x1="350" y1="410" x2="200" y2="438" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══ FIRESTORE ═══ -->
  <rect x="340" y="440" width="240" height="90" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="460" y="462" text-anchor="middle" font-size="11" fill="#c2410c" font-weight="600">CLOUD FIRESTORE</text>
  <text x="460" y="482" text-anchor="middle" font-size="12" fill="#1e293b">Persistence Layer</text>
  <text x="460" y="498" text-anchor="middle" font-size="10" fill="#64748b">signals_unified · universe_companies</text>
  <text x="460" y="514" text-anchor="middle" font-size="10" fill="#64748b">signal_history · discovery_results</text>
  <text x="460" y="524" text-anchor="middle" font-size="10" fill="#94a3b8">SHA-256 dedup · append-only history</text>

  <!-- Arrow: Proposal Agent → Firestore -->
  <line x1="460" y1="410" x2="460" y2="438" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow: State Engine ↔ Firestore -->
  <line x1="290" y1="485" x2="338" y2="485" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══ NOTIFICATIONS ═══ -->
  <rect x="640" y="440" width="250" height="90" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="765" y="462" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">TELEGRAM NOTIFICATIONS</text>
  <text x="765" y="482" text-anchor="middle" font-size="12" fill="#1e293b">Two-tier ACT alerts</text>
  <text x="765" y="498" text-anchor="middle" font-size="10" fill="#64748b">🟢 ACT (first signal)</text>
  <text x="765" y="514" text-anchor="middle" font-size="10" fill="#64748b">🟢🟢 ACT (reinforced)</text>
  <text x="765" y="524" text-anchor="middle" font-size="10" fill="#94a3b8">telegram_notifier.py</text>

  <!-- Arrow: Proposal Agent → Notifications -->
  <line x1="570" y1="410" x2="720" y2="438" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══ STREAMLIT UI ═══ -->
  <rect x="220" y="565" width="480" height="80" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="460" y="587" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">STREAMLIT INTERFACE</text>
  <text x="460" y="607" text-anchor="middle" font-size="12" fill="#1e293b">Signal review · Ingestion · Discovery · Universe · Config · Performance</text>
  <text x="460" y="627" text-anchor="middle" font-size="10" fill="#64748b">Position management (act / defer / decline) · Signal history · Backtest metrics</text>
  <text x="460" y="639" text-anchor="middle" font-size="10" fill="#94a3b8">Reads from Firestore only — no backend imports</text>

  <!-- Arrow: Firestore → Streamlit -->
  <line x1="460" y1="530" x2="460" y2="563" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <!-- Arrow: Streamlit → Ingestion (job submission) -->
  <path d="M 220,605 L 50,605 L 50,152 L 80,152" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="55" y="400" font-size="9" fill="#d97706" transform="rotate(-90,55,400)">job submission</text>

  <!-- ═══ LLM LABELS ═══ -->
  <rect x="700" y="55" width="190" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="795" y="75" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">LLM MODELS</text>
  <text x="795" y="95" text-anchor="middle" font-size="10" fill="#1e293b">Classification: Claude Sonnet</text>
  <text x="795" y="111" text-anchor="middle" font-size="10" fill="#1e293b">Agentic layers: Haiku + Sonnet</text>
  <text x="795" y="127" text-anchor="middle" font-size="10" fill="#1e293b">Synthesis: Claude Sonnet</text>
  <text x="795" y="143" text-anchor="middle" font-size="10" fill="#1e293b">Simple lenses: Gemini Flash</text>
  <text x="795" y="157" text-anchor="middle" font-size="9" fill="#94a3b8">Prompt caching on Sonnet layers</text>

  <!-- ═══ VM CONTEXT ═══ -->
  <text x="460" y="672" text-anchor="middle" font-size="10" fill="#94a3b8">GCP e2-micro VM · systemd job_runner · cron pipeline · europe-west2</text>
</svg>